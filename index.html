<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calculator Demo — Harsh Verma</title>
<meta name="description" content="Web demo of C calculator by Harsh Verma. Add, subtract, multiply, divide with validation." />
<style>
  :root{--bg:#000;--card:#0a0f0a;--line:rgba(34,197,94,.2);--accent:#22c55e;--text:#eef5ef;--muted:#9db8a4}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}
  .box{max-width:360px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  small{font-family:monospace;color:var(--accent);font-size:.8rem}
  h1{font-size:1.2rem;margin:6px 0 4px}
  p{color:var(--muted);font-size:.9rem;margin-bottom:14px}
  .display{width:100%;background:#000;border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:monospace;font-size:1.5rem;text-align:right;padding:12px;min-height:58px;margin-bottom:12px;overflow:hidden}
  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  button{background:#060a06;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:13px 0;font-size:1rem;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.op{color:var(--accent)}
  button.eq{background:var(--accent);color:#03170b;font-weight:700;border-color:var(--accent)}
  .voice{width:100%;background:rgba(34,197,94,.1);border:1px solid var(--line);color:var(--accent);border-radius:8px;padding:11px;font-weight:700;cursor:pointer;margin-bottom:8px}
  .voice.listening{background:var(--accent);color:#03170b}
  .vstatus{font-size:.8rem;color:var(--muted);min-height:20px;margin-bottom:10px;font-family:monospace}
  a{color:var(--accent);font-size:.9rem;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <small>C-CALCULATOR — WEB DEMO</small>
  <h1>Calculator</h1>
  <p>Mirrors the console version. Now with voice input. Full C source in this repo.</p>
  <div class="display" id="d">0</div>
  <div class="vstatus" id="vs">Voice: press and speak, e.g. five plus three</div>
  <button class="voice" id="vb" type="button">Voice input</button>
  <div class="keys">
    <button data-k="C">C</button><button data-k="back">Back</button><button data-k="%" class="op">%</button><button data-k="/" class="op">/</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="*" class="op">*</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="-" class="op">-</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="+" class="op">+</button>
    <button data-k="0">0</button><button data-k=".">.</button><button data-k="=" class="eq">=</button><button data-k="neg">+/-</button>
  </div>
  <p style="margin-top:14px"><a href="https://github.com/harsh17908/c-calculator">View C source</a> · <a href="https://harsh17908.github.io/personal-portfolio/">Portfolio</a></p>
</div>
<script>
(function(){
  const d=document.getElementById('d');
  let cur='0',prev=null,op=null,fresh=true;
  function show(v){d.textContent=v;}
  function calc(a,b,o){a=parseFloat(a);b=parseFloat(b);if(o==='+')return a+b;if(o==='-')return a-b;if(o==='*')return a*b;if(o==='/'){if(b===0)return 'Error';return a/b;}if(o==='%'){if(b===0)return 'Error';return a%b;}return b;}
  document.querySelectorAll('.keys button').forEach(btn=>{btn.addEventListener('click',()=>{
    const k=btn.getAttribute('data-k');
    if(k==='C'){cur='0';prev=null;op=null;fresh=true;show(cur);return;}
    if(k==='back'){cur=cur.length>1?cur.slice(0,-1):'0';show(cur);return;}
    if(k==='neg'){if(cur!=='0'&&cur!=='Error'){cur=cur.startsWith('-')?cur.slice(1):'-'+cur;show(cur);}return;}
    if(k==='='){if(op&&prev!==null){const r=calc(prev,cur,op);cur=(typeof r==='number')?(Math.round(r*1e10)/1e10).toString():r;prev=null;op=null;fresh=true;show(cur);}return;}
    if(['+','-','*','/','%'].includes(k)){if(op&&prev!==null&&!fresh){const r=calc(prev,cur,op);cur=(typeof r==='number')?(Math.round(r*1e10)/1e10).toString():r;show(cur);}prev=cur;op=k;fresh=true;return;}
    if(k==='.'){if(fresh){cur='0.';fresh=false;}else if(!cur.includes('.'))cur+=k;show(cur);return;}
    if(fresh){cur=k;fresh=false;}else{cur=(cur==='0')?k:cur+k;}show(cur);
  });});
  window.__voiceCalc=function(expr){
    const map={};document.querySelectorAll('.keys button').forEach(b=>{map[b.getAttribute('data-k')]=b;});
    if(map['C'])map['C'].click();
    if(expr==='C')return;
    for(const ch of expr){
      if(ch>='0'&&ch<='9'){if(map[ch])map[ch].click();}
      else if(ch==='.'){if(map['.'])map['.'].click();}
      else if(['+','-','*','/','%'].includes(ch)){if(map[ch])map[ch].click();}
    }
    if(map['='])map['='].click();
  };
})();
(function(){
  const btn=document.getElementById('vb'),st=document.getElementById('vs');
  if(!btn)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){if(st)st.textContent='Voice not supported here — use Chrome.';btn.disabled=true;return;}
  const words={zero:'0',one:'1',two:'2',to:'2',too:'2',three:'3',four:'4',for:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10',eleven:'11',twelve:'12',thirteen:'13',fourteen:'14',fifteen:'15',sixteen:'16',seventeen:'17',eighteen:'18',nineteen:'19',twenty:'20',point:'.',dot:'.'};
  function parse(t){t=' '+t.toLowerCase()+' ';Object.keys(words).forEach(w=>{t=t.replace(new RegExp('\\b'+w+'\\b','g'),' '+words[w]+' ');});t=t.replace(/\bdivided by\b/g,'/').replace(/\bmultiply by\b/g,'*').replace(/\bmultiplied by\b/g,'*').replace(/\bplus\b/g,'+').replace(/\badd\b/g,'+').replace(/\bminus\b/g,'-').replace(/\bsubtract\b/g,'-').replace(/\btimes\b/g,'*').replace(/\bmultiply\b/g,'*').replace(/\bdivide\b/g,'/').replace(/\bover\b/g,'/').replace(/\bmod\b/g,'%').replace(/\bpercent\b|\bpercentage\b/g,'%').replace(/\bequals?\b|\bcalculate\b|\bresult\b/g,'=').replace(/\bclear\b/g,'C');t=t.replace(/[^0-9+\-*/.%()= C]/g,' ');return t.replace(/\s+/g,'');}
  const rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=1;
  rec.onstart=()=>{btn.classList.add('listening');btn.textContent='Listening...';if(st)st.textContent='Listening... speak now';};
  rec.onend=()=>{btn.classList.remove('listening');btn.textContent='Voice input';};
  rec.onerror=(e)=>{if(st)st.textContent='Voice error: '+e.error;};
  rec.onresult=(e)=>{const tr=e.results[0][0].transcript;if(st)st.textContent='Heard: '+tr;const ex=parse(tr);if(!ex||!/[0-9]/.test(ex)){if(st)st.textContent='Could not understand: '+tr+' — try e.g. five plus three';return;}if(window.__voiceCalc)window.__voiceCalc(ex);if(st)st.textContent+=' → '+ex;};
  btn.addEventListener('click',()=>{try{rec.start();}catch(e){}});
})();
</script>
</body>
</html>
